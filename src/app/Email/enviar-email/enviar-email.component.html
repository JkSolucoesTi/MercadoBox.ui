<p-card header="Importação de Emails">

    <p class="text-sm text-gray-600">
        Importe um arquivo CSV contendo <strong>nome</strong>, <strong>email</strong> e <strong>data retorno</strong>
        para envio do comunicado.
    </p>

    <p-divider></p-divider>

    <p-toolbar>
        <div class="p-toolbar-group-left">

            <p-fileUpload #fileUpload mode="basic" chooseLabel="Selecionar CSV" accept=".csv" [auto]="false" 
                (onSelect)="onFileSelect($event)">
            </p-fileUpload>

        </div>

        <div class="p-toolbar-group-right" *ngIf="pessoas.length">
            <span class="mr-3">
                Total: <strong>{{ pessoas.length }}</strong>
            </span>

            <p-button label="Enviar Emails" icon="pi pi-send" (onClick)="enviarEmails()" [loading]="loading">
            </p-button>
        </div>
    </p-toolbar>

    <p-table *ngIf="pessoas.length" [value]="pessoas" class="mt-3" [paginator]="true" [rows]="10"
        responsiveLayout="scroll">

        <ng-template pTemplate="header">
            <tr>
                <th style="width:25%">Nome</th>
                <th style="width:30%">Email</th>
                <th style="width:20%">Data Retorno</th>
                <th style="width:15%">Status</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-pessoa>
            <tr>
                <td>{{ pessoa.nome }}</td>
                <td>{{ pessoa.email }}</td>
                <td>{{ pessoa.dataRetorno }}</td>
                <td><span class="status-badge" [ngClass]="{
      'status-success': pessoa.status === 'Sucesso',
      'status-pending': !pessoa.status || pessoa.status === 'Pendente',
      'status-error': pessoa.status && pessoa.status !== 'Sucesso' && pessoa.status !== 'Pendente'
    }">

                        {{ pessoa.status || 'Pendente' }}

                    </span></td>
            </tr>
        </ng-template>

    </p-table>

    <div *ngIf="!pessoas.length && !loading" class="text-center mt-5 text-gray-500">
        Nenhum arquivo importado.
    </div>

</p-card>

<p-dialog header="Erro ao importar CSV" [(visible)]="show" [modal]="true" [closable]="false"
    [style]="{ width: '400px' }">

    <p>{{ Message }}</p>

    <ng-template pTemplate="footer">
        <p-button label="Ok" icon="pi pi-check" (onClick)="show = false" [loading]="loading">
        </p-button>
    </ng-template>

</p-dialog>
