<p-panel [showHeader]="false">
  <div class="flex align-items-center justify-content-between mb-4">
    <div>
      <h1 class="text-3xl font-bold m-0 titulo-principal">{{titulo}}</h1>
      <p class="text-sm text-gray-600 m-0">{{descricao}}</p>
    </div>

    <div *ngIf="!modal">
      <button pButton label="{{btnDescricao}}" icon="pi pi-plus" class="p-button-success" style="height: 38px;"
        (click)="Acao()"></button>
    </div>

    <div *ngIf="modal">
      <button pButton label="{{btnDescricao}}" icon="pi pi-plus" class="p-button-success" style="height: 38px;"
        (click)="Modal()">
      </button>
    </div>

  </div>
</p-panel>
