<form [formGroup]="form" class="p-fluid">

  <div class="grid">
    <!-- Código de Barras -->
    <div class="col-12">
      <div class="field">
        <label for="codigoBarras">Código de Barras</label>
        <input id="codigoBarras" type="text" pInputText formControlName="codigoBarras"
          placeholder="Código de Barras do Produto" mask="9999999999999" />
      </div>
    </div>

    <!-- Nome -->
    <div class="col-12">
      <div class="field">
        <label for="nome">Nome</label>
        <input id="nome" type="text" pInputText formControlName="nome" placeholder="Nome do Produto" required />
      </div>
    </div>

    <!-- Preço e Quantidade na mesma linha -->
    <div class="col-12 md:col-6">
      <div class="field">
        <label for="preco">Preço</label>
        <input type="text" pInputText formControlName="preco" (input)="onPrecoInput($event,'preco')" placeholder="R$ 0,00">
      </div>
    </div>

    <div class="col-12 md:col-6">
      <div class="field">
        <label for="quantidade">Quantidade</label>
        <input id="quantidade" type="number" pInputText formControlName="quantidade" placeholder="Quantidade"
          required />
      </div>
    </div>

    <div class="col-12 md:col-6 flex items-center mt-4">
      <p-checkbox inputId="promocao" formControlName="promocao" [binary]="true" label="Item com promoção"></p-checkbox>
    </div>

    <div class="col-12 md:col-6" *ngIf="isPromocao">
      <div class="field">
        <label for="valorPromocional">Valor Promocional</label>
        <input type="text" pInputText formControlName="valorPromocional" (input)="onPrecoInput($event,'valorPromocional')" placeholder="R$ 0,00">
      </div>
    </div>

    <div class="col-12 flex justify-content-end mt-3">
      <button pButton type="submit" label="Adicionar Item" icon="pi pi-save" class="p-button-success"
        (click)="salvar()"></button>
    </div>
  </div>
</form>
