<p-menubar [model]="items" class="navbar">
  <ng-template pTemplate="start">
        <img
      src="assets/logo.png"
      alt="Logo"
      class="logo"
      routerLink="/home"
      style="cursor: pointer"
      height="50"
    />
  </ng-template>
<ng-template pTemplate="end">
  <button 
    pButton 
    icon="pi pi-sign-out" 
    class="p-button-text p-button-plain"
    (click)="sair()"
    style="margin-right: 1rem;">
  </button>
</ng-template>
</p-menubar>
