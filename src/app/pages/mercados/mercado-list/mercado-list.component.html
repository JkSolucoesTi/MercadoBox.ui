<div class="container p-4">
  <app-panel
  [titulo]="'Mercado'"
  [descricao]="'Gerencie os mercados onde você faz compra'"
  [rota]="'/mercados/novo'"
  [btnDescricao]="'Mercado'"
  [modal]="false"

  >
  </app-panel>

  <p-divider />

  <!-- Cards dos mercados -->
  <div class="grid">
    <div class="col-12 md:col-6 lg:col-4" *ngFor="let mercado of mercados">
      <app-mercado-card [mercado]="mercado" ></app-mercado-card>
    </div>
  </div>
</div>
