<div class="container p-4">
  <app-panel [titulo]="'Produtos'" [descricao]="'Gerencie seus produtos'" [rota]="'/produtos/novo'"
    [btnDescricao]="'Produto'" [modal]="false">
  </app-panel>

  <div class="search-bar flex align-items-center gap-2 mb-3 mt-3">
    <div class="flex-grow-1">
      <form [formGroup]="form">
        <p-autoComplete formControlName="produto" [suggestions]="produtosFiltrados"
          (completeMethod)="search($event)" [minLength]="3" placeholder="Pesquise aqui o seu produto"
          (onSelect)="onProdutoSelecionado($event)" [style]="{ width: '100%' }" inputStyleClass="w-full" [maxlength]="13">
          <ng-template let-produto pTemplate="item">
            <div class="flex flex-column">{{ produto.nome }}</div>
          </ng-template>
           <ng-template let-produto pTemplate="selectedItem">
              {{ produto.codigo }} - {{ produto.nome }}
           </ng-template>
        </p-autoComplete>
      </form>
    </div>

    <div class="flex align-items-center">      
      <button pButton type="button" icon="pi pi-search" (click)="consultar()"
        class="p-button-outlined" pTooltip="Pesquisar" tooltipPosition="top"></button>
    </div>
  </div>

  <p-divider />

  <div class="grid">
    <div class="col-12 md:col-6 lg:col-4" *ngFor="let produto of produtos">
      <app-produtos-card [produto]="produto" (abrirCodigo)="abrirModalCodigo($event)"></app-produtos-card>
    </div>
  </div>

  <p-dialog [(visible)]="modalCodigo" header="Codigo de Barras">
    <app-barcode-ean13 [codigo]="codigoSelecionado"></app-barcode-ean13>
  </p-dialog>

</div>
<div class="paginator-fixed">
  <p-paginator [first]="first" [rows]="rows" [totalRecords]="totalRecords" [pageLinkSize]="2"
    [rowsPerPageOptions]="[5, 10, 15]" [showFirstLastIcon]="false" (onPageChange)="onPageChange($event)"></p-paginator>
</div>
